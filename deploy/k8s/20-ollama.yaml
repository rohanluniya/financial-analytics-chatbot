# Ollama (open-source local LLM server) on CPU. Internal ClusterIP only, no auth needed
# because nothing outside the namespace/cluster can reach it.
apiVersion: v1
kind: Service
metadata:
  name: ${PREFIX}-ollama
  namespace: ${NAMESPACE}
spec:
  type: ClusterIP
  selector:
    app: ${PREFIX}-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${PREFIX}-ollama
  namespace: ${NAMESPACE}
spec:
  serviceName: ${PREFIX}-ollama
  replicas: 1
  selector:
    matchLabels:
      app: ${PREFIX}-ollama
  template:
    metadata:
      labels:
        app: ${PREFIX}-ollama
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: ${NODE_POOL}
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "8192"
            - name: OLLAMA_NUM_PARALLEL      # 2 slots: planner and writer prompts keep their own KV cache
              value: "2"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          # Small requests, generous limits: uses idle CPU on the shared pool, yields under contention.
          resources:
            requests:
              cpu: 400m
              memory: 3Gi
            limits:
              cpu: "40"
              memory: 48Gi
          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 60Gi
