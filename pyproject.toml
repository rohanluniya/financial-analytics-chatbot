[project]
name = "iris"
version = "1.0.0"
description = "Conversational financial-analytics chatbot prototype for a fictional TIC company (RL Group). Synthetic data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pyodbc>=5.1",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
    "streamlit>=1.39",
    "plotly>=5.24",
    "rapidfuzz>=3.10",
    "sqlglot>=25.0",
    "openpyxl>=3.1",
    "google-auth>=2.30",
    "tabulate>=0.9",
    "statsmodels>=0.14.4",
    "holidays>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
